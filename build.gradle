plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.8.0"
}

group = 'site.muyin.sso'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.25.0')
    compileOnly 'run.halo.app:api'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
    doFirst {
        delete layout.buildDirectory.dir('resources/main/ui')
    }
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    externalUrl = 'http://127.0.0.1:8090'
    version = '2.25.4'
    port = 8090
    debug = true
    debugPort = 8191
}

haloPlugin {
    openApi {
        useExistingServer = true
        outputDir = file("$rootDir/api-docs/openapi/v3_0")
        groupingRules {
            ssoApis {
                displayName = 'Extension API for SSO Plugin'
                pathsToMatch = [
                        '/apis/public.sso.muyin.site/v1alpha1/**',
                        '/apis/console.sso.muyin.site/v1alpha1/**',
                        '/apis/uc.sso.muyin.site/v1alpha1/**'
                ]
            }
        }
        groupedApiMappings = [
                '/v3/api-docs/ssoApis': 'ssoApis.json'
        ]
        generator {
            outputDir = file("${projectDir}/ui/src/api/generated")
        }
    }

    watchDomains {
        consoleSource {
            // Monitor file changes in the console/src/ directory
            files files('ui/src/')
        }
    }
}
